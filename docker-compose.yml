version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: smartbiz_db
    restart: always
    environment:
      POSTGRES_USER: smartbiz
      POSTGRES_PASSWORD: smartbiz_password
      POSTGRES_DB: smartbiz
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartbiz_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://smartbiz:smartbiz_password@db:5432/smartbiz
      SECRET_KEY: smartbiz-ai-production-super-secret-key
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartbiz_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
